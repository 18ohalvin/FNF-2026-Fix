name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-build:
    name: Build & Verify Production Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application Bundle
        run: npm run build

      - name: Verify Dist Artifact Existence
        run: test -d dist && test -f dist/index.html

  docker-build-check:
    name: Validate Docker Image Build
    runs-on: ubuntu-latest
    needs: audit-and-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Container
        run: docker build -t fix-707-form:test .
